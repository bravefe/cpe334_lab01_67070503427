version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: toktickit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: toktickit
      POSTGRES_PASSWORD: toktickit
      POSTGRES_DB: toktickit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: